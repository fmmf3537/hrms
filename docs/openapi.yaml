openapi: 3.0.3
info:
  title: HRMS API
  version: 1.2.0
  description: |
    西安辰航卓越科技有限公司 HRMS 一期 API

    涵盖范围：M0（已实现）+ M0.5（5 个公共模块 + AI 底座，将实现）

    配套文档：
    - [API Spec Markdown](./api-spec.md)
    - [错误码表](./error-codes.md)
    - [Mermaid 流程图](./flow-diagrams.md)
    - [主文档 HRMS-V1.2.md](./HRMS-V1.2.md)
  contact:
    name: HRMS Team
    email: it@chenhang-zhuoyue.com
  license:
    name: Proprietary

servers:
  - url: http://localhost:3000/api
    description: 开发环境
  - url: https://hrms.your-domain.com/api
    description: 生产环境（待定）

tags:
  - name: Health
    description: 健康检查
  - name: Auth
    description: 认证（登录/刷新/登出/当前用户）
  - name: Audit
    description: 审计日志查询
  - name: ApprovalFlow
    description: 审批流模板管理（M0.5-1）
  - name: ApprovalInstance
    description: 审批实例操作（M0.5-1）
  - name: Notification
    description: 通知（M0.5-2）
  - name: EncryptedField
    description: 字段加密管理（M0.5-3）
  - name: Integration
    description: 第三方对接管理（M0.5-4）
  - name: AI
    description: AI 底座能力（M0.5-5）
  - name: Company
    description: 法人公司（M1-A1）
  - name: Department
    description: 部门树（M1-A1）
  - name: Employee
    description: 员工档案（M1-A2）
  - name: Onboarding
    description: 入职流程（M1-A3）
  - name: Regularization
    description: 转正流程（M1-A4）
  - name: Offboarding
    description: 离职流程（M1-A6）
  - name: Salary
    description: 薪酬核算（M4-C1 薪级薪档 + 员工薪酬方案）

security:
  - BearerAuth: []

paths:
  # ============== Health ==============
  /health:
    get:
      tags: [Health]
      summary: 健康检查
      security: []
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # ============== Auth ==============
  /auth/login:
    post:
      tags: [Auth]
      summary: 用户登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/AccountDisabled'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: 刷新 accessToken（rotation + reuse 检测）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 刷新令牌无效 / 过期 / 被重用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: 登出（吊销 refreshToken）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/me:
    get:
      tags: [Auth]
      summary: 获取当前登录用户信息
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/UserInfo'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccountDisabled'

  /auth/permission-demo:
    get:
      tags: [Auth]
      summary: 联调演示（需 salary:read 权限）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          userId:
                            type: string
                            format: uuid
                          username:
                            type: string
                          permissions:
                            type: array
                            items:
                              type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============== Audit ==============
  /audit-logs:
    get:
      tags: [Audit]
      summary: 分页查询审计日志
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: userId
          schema:
            type: string
            format: uuid
        - in: query
          name: action
          schema:
            type: string
            enum: [LOGIN, CREATE, UPDATE, DELETE, EXPORT]
        - in: query
          name: resourceType
          schema:
            type: string
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditLog'
                      total:
                        type: integer
                      page:
                        type: integer
                      pageSize:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /audit-logs/{id}/reveal:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Audit]
      summary: 申请查看某条审计的明文（V1.2 角色化脱敏）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields, reason]
              properties:
                fields:
                  type: array
                  items:
                    type: string
                  example: ["before.base_salary", "after.base_salary"]
                reason:
                  type: string
                  minLength: 5
                  example: "处理员工投诉，需要核对调薪记录"
      responses:
        '200':
          description: 成功（仅返回请求字段的明文，其他仍 mask）
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    additionalProperties: true
        '403':
          description: 角色无权限（如 dept_head 不允许看明文）或字段不在脱敏白名单内
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          $ref: '#/components/responses/NotFound'

  # ============== Approval Flow (M0.5-1) ==============
  /approval-flows:
    get:
      tags: [ApprovalFlow]
      summary: 列出所有审批流模板
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalFlow'
    post:
      tags: [ApprovalFlow]
      summary: 创建审批流模板
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalFlowInput'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalFlow'

  /approval-flows/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [ApprovalFlow]
      summary: 获取单个模板
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalFlow'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [ApprovalFlow]
      summary: 更新模板
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalFlowInput'
      responses:
        '200':
          description: 更新成功
    delete:
      tags: [ApprovalFlow]
      summary: 删除模板（软删除）
      responses:
        '204':
          description: 删除成功

  /approval-instances:
    get:
      tags: [ApprovalInstance]
      summary: 列出我的审批（待办/已办/我发起）
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected, withdrawn, all]
            default: pending
        - in: query
          name: role
          schema:
            type: string
            enum: [approver, initiator, all]
            default: approver
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalInstance'
    post:
      tags: [ApprovalInstance]
      summary: 提交审批
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalInstanceSubmitInput'
      responses:
        '201':
          description: 提交成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalInstance'

  /approval-instances/{id}/approve:
    post:
      tags: [ApprovalInstance]
      summary: 审批通过
      parameters:
        - in: path
          name: id
          required: true
          schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
      responses:
        '200':
          description: 审批成功

  /approval-instances/{id}/reject:
    post:
      tags: [ApprovalInstance]
      summary: 审批驳回
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
      responses:
        '200':
          description: 驳回成功

  /approval-instances/{id}/transfer:
    post:
      tags: [ApprovalInstance]
      summary: 转交他人
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toUserId]
              properties:
                toUserId:
                  type: string
                  format: uuid
                comment:
                  type: string
      responses:
        '200':
          description: 转交成功

  /approval-instances/{id}/withdraw:
    post:
      tags: [ApprovalInstance]
      summary: 发起人撤回
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 撤回成功

  # ============== Notification (M0.5-2) ==============
  /notifications:
    get:
      tags: [Notification]
      summary: 我的通知列表
      parameters:
        - in: query
          name: unreadOnly
          schema:
            type: boolean
            default: false
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'

  /notifications/unread-count:
    get:
      tags: [Notification]
      summary: 未读通知数
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer

  /notifications/{id}/read:
    post:
      tags: [Notification]
      summary: 标记已读
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功

  /notifications/read-all:
    post:
      tags: [Notification]
      summary: 全部已读
      responses:
        '200':
          description: 成功

  /notifications/send:
    post:
      tags: [Notification]
      summary: 主动发通知（admin/HR）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSendInput'
      responses:
        '202':
          description: 已加入发送队列

  # ============== Encrypted Field (M0.5-3) ==============
  /encrypted-fields:
    get:
      tags: [EncryptedField]
      summary: 列出已加密字段配置（admin）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EncryptedField'
    post:
      tags: [EncryptedField]
      summary: 注册加密字段（admin）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncryptedFieldInput'
      responses:
        '201':
          description: 创建成功

  /encrypted-fields/{id}/decrypt:
    post:
      tags: [EncryptedField]
      summary: 解密单个字段
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [recordId]
              properties:
                recordId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: string
                    description: 解密后的明文

  /encrypted-fields/rotate-key:
    post:
      tags: [EncryptedField]
      summary: 触发密钥轮转（admin）
      responses:
        '202':
          description: 轮转已启动

  # ============== Integration (M0.5-4) ==============
  /integrations:
    get:
      tags: [Integration]
      summary: 列出所有集成（admin）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Integration'

  /integrations/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Integration]
      summary: 单个集成详情
      responses:
        '200':
          description: 成功
    put:
      tags: [Integration]
      summary: 更新配置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationInput'
      responses:
        '200':
          description: 成功
    delete:
      tags: [Integration]
      summary: 注销集成
      responses:
        '204':
          description: 成功

  /integrations/{id}/sync:
    post:
      tags: [Integration]
      summary: 手动触发同步
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: 同步已加入队列

  /integrations/{id}/test:
    post:
      tags: [Integration]
      summary: 测试连通性
      parameters:
        - in: path
          name: id
          required: true
          schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 连通成功

  # ============== AI (M0.5-5) ==============
  /ai/ocr:
    post:
      tags: [AI]
      summary: OCR 识别（身份证/银行卡/证书）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, documentType]
              properties:
                file:
                  type: string
                  format: binary
                documentType:
                  type: string
                  enum: [id_card, bank_card, certificate]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OcrResult'

  /ai/qa:
    post:
      tags: [AI]
      summary: 智能问答（HR Q&A）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiQaInput'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AiQaResult'

  /ai/summarize:
    post:
      tags: [AI]
      summary: 文本摘要（算薪异常摘要等）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, data]
              properties:
                type:
                  type: string
                  enum: [payroll_diff, performance_summary, contract_renewal]
                data:
                  type: object
      responses:
        '200':
          description: 成功

  /ai/score-suggest:
    post:
      tags: [AI]
      summary: 绩效评分建议
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiScoreSuggestInput'
      responses:
        '200':
          description: 成功

  /companies:
    get:
      tags: [Company]
      summary: 法人列表
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: 成功
    post:
      tags: [Company]
      summary: 创建法人
      security: [{ BearerAuth: [] }]
      responses:
        '201':
          description: 已创建
  /companies/{id}:
    get:
      tags: [Company]
      summary: 法人详情
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 成功
    put:
      tags: [Company]
      summary: 更新法人
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 成功
    delete:
      tags: [Company]
      summary: 软删除法人
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 成功
  /companies/{id}/statistics:
    get:
      tags: [Company]
      summary: 法人统计
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 成功
  /companies/{id}/headcount-warning:
    get:
      tags: [Company]
      summary: 编制预警
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 成功

  /departments:
    get:
      tags: [Department]
      summary: 部门列表
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: 成功
    post:
      tags: [Department]
      summary: 创建部门
      security: [{ BearerAuth: [] }]
      responses:
        '201':
          description: 已创建
  /departments/tree:
    get:
      tags: [Department]
      summary: 部门树
      security: [{ BearerAuth: [] }]
      parameters:
        - name: companyId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 成功
  /departments/{id}:
    get:
      tags: [Department]
      summary: 部门详情
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 成功
    put:
      tags: [Department]
      summary: 更新部门
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 成功
    delete:
      tags: [Department]
      summary: 软删除部门
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 成功
  /departments/{id}/move:
    post:
      tags: [Department]
      summary: 移动部门
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true

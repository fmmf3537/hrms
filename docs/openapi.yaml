components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidCredentials:
      description: 用户名或密码错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AccountDisabled:
      description: 账号已停用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: 请求过于频繁
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ============== 通用 ==============
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data: {}

    ErrorResponse:
      type: object
      required: [success, error, code]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: 人类可读错误信息
        code:
          type: integer
          description: 业务错误码（详见 error-codes.md）
          example: 10110
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
        uptime:
          type: integer
          description: 进程启动秒数

    # ============== 认证 ==============
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 2
          maxLength: 50
        password:
          type: string
          minLength: 6

    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserInfo'
        accessToken:
          type: string
        refreshToken:
          type: string

    UserInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, disabled]
        mustChangePassword:
          type: boolean
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        companyId:
          type: string
          format: uuid
          nullable: true
        departmentId:
          type: string
          format: uuid
          nullable: true
        employee:
          type: object
          nullable: true

    # ============== 审计 ==============
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          nullable: true
        actorType:
          type: string
          enum: [USER, AGENT, SYSTEM, INTEGRATION]
          default: USER
          description: V1.2.1 新增 — 操作主体类型
        action:
          type: string
          enum: [LOGIN, CREATE, UPDATE, DELETE, EXPORT, AUDIT_REVEAL]
        resourceType:
          type: string
        resourceId:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        oldValue:
          type: object
          nullable: true
        newValue:
          type: object
          nullable: true
        ipAddress:
          type: string
          nullable: true
        userAgent:
          type: string
          nullable: true
        status:
          type: string
          enum: [SUCCESS, FAILURE]
        createdAt:
          type: string
          format: date-time

    # ============== 审批流 ==============
    ApprovalFlow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
          example: leave
        key:
          type: string
          example: leave_default
        name:
          type: string
        version:
          type: integer
        nodes:
          type: array
          items:
            type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ApprovalFlowInput:
      type: object
      required: [category, key, name, nodes]
      properties:
        category:
          type: string
        key:
          type: string
        name:
          type: string
        nodes:
          type: array
          items:
            type: object

    ApprovalInstance:
      type: object
      properties:
        id:
          type: string
          format: uuid
        flowKey:
          type: string
        businessType:
          type: string
        businessId:
          type: string
          format: uuid
        title:
          type: string
        initiatorId:
          type: string
          format: uuid
        currentNodeId:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, approved, rejected, withdrawn]
        data:
          type: object
        history:
          type: array
          items:
            type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ApprovalInstanceSubmitInput:
      type: object
      required: [flowKey, businessType, businessId, title, data]
      properties:
        flowKey:
          type: string
        businessType:
          type: string
        businessId:
          type: string
          format: uuid
        title:
          type: string
        data:
          type: object

    # ============== 通知 ==============
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        templateKey:
          type: string
        channel:
          type: string
          enum: [in_app, email, sms]
        title:
          type: string
        content:
          type: string
        data:
          type: object
        read:
          type: boolean
        sentAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          nullable: true

    NotificationSendInput:
      type: object
      required: [templateKey, channels, recipients, data]
      properties:
        templateKey:
          type: string
        channels:
          type: array
          items:
            type: string
            enum: [in_app, email, sms]
        recipients:
          type: array
          items:
            type: object
            properties:
              userId:
                type: string
                format: uuid
        data:
          type: object

    # ============== 加密 ==============
    EncryptedField:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tableName:
          type: string
        columnName:
          type: string
        encryptionAlgo:
          type: string
          enum: [aes-256-gcm]
        keyVersion:
          type: integer
        accessRoles:
          type: array
          items:
            type: string

    EncryptedFieldInput:
      type: object
      required: [tableName, columnName, accessRoles]
      properties:
        tableName:
          type: string
        columnName:
          type: string
        encryptionAlgo:
          type: string
          default: aes-256-gcm
        accessRoles:
          type: array
          items:
            type: string

    # ============== 集成 ==============
    Integration:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: esign
        name:
          type: string
        type:
          type: string
          enum: [http_api, webhook, database, file]
        config:
          type: object
          description: 配置（敏感字段脱敏）
        enabled:
          type: boolean
        lastSyncAt:
          type: string
          format: date-time
          nullable: true

    IntegrationInput:
      type: object
      required: [code, name, type, config]
      properties:
        code:
          type: string
        name:
          type: string
        type:
          type: string
        config:
          type: object
        enabled:
          type: boolean
          default: true

    # ============== AI ==============
    OcrResult:
      type: object
      properties:
        documentType:
          type: string
          enum: [id_card, bank_card, certificate]
        fields:
          type: object
          additionalProperties:
            type: string
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        cost:
          type: number
          format: float

    AiQaInput:
      type: object
      required: [question]
      properties:
        question:
          type: string
        context:
          type: object
          properties:
            userRole:
              type: string
            departmentId:
              type: string
              format: uuid

    AiQaResult:
      type: object
      properties:
        answer:
          type: string
        sources:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              url:
